<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

<body>

<header class="nav">

<main class="productos">

    <div class="card">
        <span class="etiqueta">10%</span>
        <img src="img/photo-1511707171634-5f897ff02aa9.jpg" alt="celular">
        <h3>Iphone 13 Pro </h3>
        <p>$100</p>
        <button>Comprar</button>
    </div>

    <div class="card">
        <span class="etiqueta">10%</span>
        <img src="img/photo-1527443224154-c4a3942d3acf.jpg" alt="monitor">
        <h3>Monitor 24" Apple </h3>
        <p>$100</p>
        <button>Comprar</button>
    </div>

    <div class="card">
        <span class="etiqueta">10%</span>
        <img src="img/photo-1587202372775-e229f172b9d7.jpg" alt="gabinete">
        <h3>Gabinete RGB </h3>
        <p>$100</p>
        <button>Comprar</button>
    </div>

    <div class="card">
        <span class="etiqueta">10%</span>
        <img src="img/images.jpg" alt="Televisor">
        <h3>Televisor '50! </h3>
        <p>$100</p>
        <button>Comprar</button>
    </div>

    
    <div class="card">
        <span class="etiqueta">10%</span>
        <img src="img/xbox.jpg" alt="Xbox Series X">
        <h3>Xbox Series X </h3>
        <p>$100</p>
        <button>Comprar</button>
    </div>

    
    <div class="card">
     <span class="etiqueta">10%</span>
     <img src="img/ps5.jpg" alt="Playstation 5">
     <h3>Playstation 5 </h3>
     <p>$100</p>
     <button>Comprar</button>
    </div>

    <div class="card">
            <span class="etiqueta">10%</span>
            <img src="img/laptop.jpg" alt="Laptop">
            <h3>Laptop Gamer </h3>
            <p>$100</p>
            <button>Comprar</button>
    </div>

</main>

<div class="seccion-contacto">
    <!-- Seccion contacto -->
    <section id = "contacto">
            <h2>Contacto</h2>
            <form>
                <input type="text" placeholder="Nombre" required>
                <input type="email" placeholder="Correo electrónico" required>
                <button type="submit">Enviar</button>
            </form>
            <textarea placeholder="Mensaje" required></textarea>
        </section>
</div>

    <div class ="footer">
        <p>Thiago Cainelli © 2026</p>
    </div>


<button class="flotante">🛒</button>
